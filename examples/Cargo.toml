[package]
name = "examples"
version = "0.1.0"
authors = ["Frostie314159 <frostie.neuenhausen@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { path = "../../esp-hal/esp-hal" }
esp-hal-embassy = { path = "../../esp-hal/esp-hal-embassy" }
esp-backtrace = { version = "0.16.0", features = ["panic-handler", "defmt"] }
esp-println = { version = "0.14.0", features = [
    "critical-section",
    "uart",
], default-features = false }

embassy-net = { version = "0.7.0", features = [
    "proto-ipv4",
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv6",
    "tcp",
    "udp",
    "dns",
    "defmt",
    "packet-trace",
] }
embassy-futures = { version = "0.1.1", features = ["defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt"] }
embassy-executor = { version = "0.7.0", features = [
    "task-arena-size-32768",
    "defmt",
] }

foa = { path = "../foa", features = ["defmt"] }
foa_sta = { path = "../foa_sta", features = ["defmt"] }
foa_awdl = { path = "../foa_awdl", features = ["defmt"] }

static_cell = "2.1.0"
heapless = "0.8.0"
embedded-io-async = "0.6.1"

defmt = "1.0.1"
defmt-rtt = "0.4.2"
reqwless = { version = "0.13.0", default-features = false, features = [
    "defmt",
] }
# esp-mbedtls = { git = "https://github.com/esp-rs/esp-mbedtls.git", default-features = false,  }
rand_core = "0.9.3"
embedded-io = "0.6.1"
esp-alloc = "0.8.0"

[features]
esp32 = [
    "esp-hal/esp32",
    "esp-hal-embassy/esp32",
    "esp-println/esp32",
    "esp-backtrace/esp32",
    "foa/esp32",
    "foa_sta/esp32",
    "foa_awdl/esp32",
]
esp32s2 = [
    "esp-hal/esp32s2",
    "esp-hal-embassy/esp32s2",
    "esp-println/esp32s2",
    "esp-backtrace/esp32s2",
    "foa/esp32s2",
    "foa_sta/esp32s2",
    "foa_awdl/esp32s2",
]
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-hal-embassy/esp32c6",
    "esp-println/esp32c6",
    "esp-backtrace/esp32c6",
    "foa/esp32c6",
    "foa_sta/esp32c6",
    "foa_awdl/esp32c6",
]
